name: DBP Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  #TG_VERSION: "1.0.5"
  WORKING_DIR: "/app-service-simple"

jobs:
  build-push:
    name: Build and Push 
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |

          #docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/flask-app:v1
          docker buildx build --platform linux/amd64 -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/flask-app:v1 . 
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/flask-app:v1